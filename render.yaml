services:
  - type: web
    name: rsa-booking
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: rsa-bookings-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOOKINGS_WORKBOOK_PATH
        value: /var/data/bookings.xlsx