name: Keep Render App Awake

on:
  schedule:
    # Runs every 5 minutes to prevent Render free instance from idling/sleeping (15-min limit)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Render
        run: |
          URL="https://rsa-booking.onrender.com"
          echo "Sending keep-alive ping to $URL/health"
          # Curl with retry to wake up if cold-starting
          RESPONSE=$(curl -s -L -w "\n%{http_code}" --retry 3 --retry-delay 5 --max-time 60 "$URL/health")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Successfully pinged application. Server is awake."
          else
            echo "Health check returned $HTTP_CODE, waking up root URL..."
            curl -s -L -f --retry 2 --retry-delay 5 --max-time 60 "$URL/" > /dev/null
          fi

